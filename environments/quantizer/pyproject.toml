[project]
name = "serving-lab-quantizer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.0",
  "transformers==4.57.1",
  "llmcompressor==0.9.0",
  "compressed-tensors==0.13.0",
  "datasets==4.4.1",
  "accelerate==1.10.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# 保留兼容基础依赖；旧压缩工具链要求的版本降级仅作用于独立前缀。
