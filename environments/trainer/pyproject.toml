[project]
name = "serving-lab-trainer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["llm-serving-lab", "torch==2.9.0", "transformers==4.57.1", "peft==0.17.1", "accelerate==1.10.1", "safetensors>=0.6,<0.7", "huggingface-hub>=0.34,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
llm-serving-lab = { path = "../..", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
