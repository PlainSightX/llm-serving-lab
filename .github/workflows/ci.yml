# CI：格式检查 + CPU单元测试。不下载模型、不启动vLLM或GPU（相关测试使用合同替身）。
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uvx ruff@0.14.4 format --check .
      - run: uv run pytest -q
