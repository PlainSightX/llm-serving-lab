[project]
name = "llm-serving-lab"
version = "0.1.0"
description = "企业任务经验巩固与受控模型更新研究工作台"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.scripts]
serving-lab = "serving_lab.cli:main"

[project.entry-points."vllm.general_plugins"]
serving_lab_release_probe = "serving_lab.engine_probe:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving_lab"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# 原代码统一使用单引号；保留引号风格，只修正换行、空格与缩进。
quote-style = "preserve"
